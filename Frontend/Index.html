<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexa N.10</title>

<style>
body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #0f0f10;
    color: white;
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    background: #1a1a1c;
    padding: 15px;
}

.sidebar h2 {
    font-size: 18px;
    color: #ff9800;
}

/* CHAT AREA */
.chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* MESSAGES */
.msg {
    max-width: 70%;
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
}

.user {
    align-self: flex-end;
    background: #2b7cff;
}

.nexa {
    align-self: flex-start;
    background: #2a2a2a;
    border: 1px solid #333;
}

/* INPUT BAR */
.input-bar {
    display: flex;
    padding: 15px;
    background: #151517;
    border-top: 1px solid #2a2a2a;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #222;
    color: white;
}

button {
    margin-left: 10px;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #ff9800;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ffa733;
}

/* TITLE */
.title {
    font-size: 20px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>🤖 Nexa N.10</h2>
    <p>ChatGPT-style UI</p>
    <p>Secure AI Assistant</p>
</div>

<!-- CHAT -->
<div class="chat-container">

    <div class="chat" id="chat"></div>

    <div class="input-bar">
        <input id="msg" placeholder="Message Nexa...">
        <button onclick="send()">Send</button>
    </div>

</div>

<script>
const chat = document.getElementById("chat");

/* ADD MESSAGE */
function addMsg(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* SEND MESSAGE */
async function send() {
    const input = document.getElementById("msg");
    const message = input.value.trim();

    if (!message) return;

    addMsg(message, "user");
    input.value = "";

    addMsg("Nexa is thinking...", "nexa");

    try {
        const res = await fetch("http://localhost:3000/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message })
        });

        const data = await res.json();

        chat.lastChild.remove(); // remove "thinking"
        addMsg(data.reply, "nexa");

    } catch (err) {
        chat.lastChild.remove();
        addMsg("Error connecting to Nexa server.", "nexa");
    }
}
</script>

</body>
</html>
