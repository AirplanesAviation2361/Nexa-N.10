<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Nexa N.20</title>


<style>

body{

margin:0;
font-family:Arial;
background:#0f0f10;
color:white;
height:100vh;
display:flex;

}


.sidebar{

width:220px;
background:#1a1a1c;
padding:15px;

}


.sidebar h2{

color:#ff9800;

}



.chat-container{

flex:1;
display:flex;
flex-direction:column;

}



.chat{

flex:1;
padding:20px;
overflow:auto;

display:flex;
flex-direction:column;
gap:12px;

}



.msg{

max-width:70%;
padding:12px;
border-radius:12px;
white-space:pre-wrap;

}



.user{

align-self:flex-end;
background:#2b7cff;

}



.nexa{

align-self:flex-start;
background:#292929;

}



.input-bar{

display:flex;
padding:15px;
background:#151517;
gap:10px;

}



input{

flex:1;
padding:12px;
border-radius:8px;
background:#222;
color:white;
border:none;

}



button{

background:#ff9800;
border:none;
border-radius:8px;
padding:12px;
cursor:pointer;

}



/* PLUS MENU */


.plus-container{

position:relative;

}



.menu{

display:none;

position:absolute;

bottom:60px;

background:#222;

width:230px;

padding:10px;

border-radius:12px;

}


.menu button{

display:block;

width:100%;

margin:5px 0;

background:#333;

color:white;

}


.menu.show{

display:block;

}



</style>

</head>


<body>



<div class="sidebar">

<h2>🤖 Nexa N.20</h2>

<p>AI Assistant</p>

<p>Voice + Files</p>

</div>




<div class="chat-container">


<div class="chat" id="chat">

</div>



<div class="input-bar">



<div class="plus-container">


<button id="plusBtn">
+
</button>


<div class="menu" id="menu">


<button>
📸 Add Photos & Files
</button>


<button>
🕒 Recent Files
</button>


<button>
🎨 Create Image
</button>


<button onclick="setMode('thinking')">
🧠 Thinking
</button>


<button onclick="setMode('research')">
🔬 Deep Research
</button>


<button onclick="setMode('web')">
🌐 Web Search
</button>


<button disabled>
✨ More Features (N.50)
</button>


</div>


</div>



<input
id="msg"
placeholder="Message Nexa..."
>



<button id="micBtn">
🎤
</button>


<button onclick="send()">
Send
</button>



<input
type="file"
id="fileInput"
hidden
>





</div>


</div>



<script>


const chat =
document.getElementById("chat");


let currentMode="normal";



function addMsg(text,type){


let div =
document.createElement("div");


div.className =
"msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop =
chat.scrollHeight;


}





function setMode(mode){

currentMode=mode;

addMsg(
"Nexa mode: "+mode,
"nexa"
);

}





async function send(){


let input =
document.getElementById("msg");


let message =
input.value.trim();



if(!message)return;



addMsg(message,"user");

input.value="";



addMsg(
"Nexa is thinking...",
"nexa"
);



const res =
await fetch(
"http://localhost:3000/chat",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

message,

mode:currentMode

})


});



const data =
await res.json();



chat.lastChild.remove();


addMsg(
data.reply,
"nexa"
);



}




// PLUS MENU


plusBtn.onclick=()=>{

menu.classList.toggle("show");

};





// VOICE


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(SpeechRecognition){


const recognition =
new SpeechRecognition();



micBtn.onclick=()=>{

recognition.start();

};



recognition.onresult=(e)=>{


msg.value =
e.results[0][0].transcript;


};


}



</script>


</body>

</html>
