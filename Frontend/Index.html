<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexa N.10</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #ff9800;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

#chat {
    height: 75vh;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    margin: 8px 0;
}

.user {
    color: #00d4ff;
}

.nexa {
    color: #00ff88;
}

footer {
    display: flex;
    padding: 10px;
    background: #222;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
}

button {
    padding: 10px;
    border: none;
    background: #ff9800;
    cursor: pointer;
}
</style>

</head>

<body>

<header>
🤖 Nexa N.10
</header>

<div id="chat"></div>

<footer>
    <input id="msg" placeholder="Ask Nexa...">
    <button onclick="send()">Send</button>
</footer>

<script>
const chat = document.getElementById("chat");

/* Add message to chat */
function addMessage(text, className) {
    const div = document.createElement("div");
    div.className = "msg " + className;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* Send message to backend */
async function send() {
    const input = document.getElementById("msg");
    const message = input.value;

    if (!message) return;

    addMessage("You: " + message, "user");

    input.value = "";

    try {
        const res = await fetch("http://localhost:3000/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message })
        });

        const data = await res.json();

        addMessage("Nexa: " + data.reply, "nexa");

    } catch (err) {
        addMessage("Nexa: Error connecting to server.", "nexa");
    }
}
</script>

</body>
</html>
